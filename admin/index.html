<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oelono — Admin</title>
  <!-- Prevent search engines from indexing the admin panel -->
  <meta name="robots" content="noindex" />
  <style>
    html, body { background: #0B0C10 !important; color: #E8ECF1 !important; }
    nav, aside, [class*=TopBar], [class*=Sidebar], [class*=CardWrapper] { background: #101319 !important; border-color: #1E2430 !important; }
    input, textarea, select { background: #151923 !important; color: #E8ECF1 !important; border: 1px solid #1E2430 !important; }
    button[class*=Button], a[class*=Button] { background: #00F0FF !important; color: #03060A !important; font-weight: 700 !important; border: none !important; }
    a { color: #00F0FF !important; }
  </style>
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS) — reads admin/config.yml automatically -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
